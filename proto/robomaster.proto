
/**
 * @file robomaster.proto
 * @brief RoboMaster 2026 机甲大师高校系列赛 自定义客户端通信协议
 * @details 官方依据：RoboMaster 2026 通信协议 V2.0.0（20260626）
 */

syntax = "proto3";

package robomaster;

// 官方各字段的枚举值一律以注释记录在字段旁，线上仍是整数，保持与官方线格式一一对应。
// 以下两个枚举仅作**命名常量**使用（并非任何消息的字段类型），取值与官方一致：
// 游戏阶段（GameStatus.current_stage）与机器人类型（RobotStaticStatus.robot_type）。
enum GameStage {
  STAGE_NOT_STARTED = 0; // 未开始比赛
  STAGE_PREPARATION = 1; // 准备阶段
  STAGE_SELF_CHECK  = 2; // 十五秒裁判系统自检
  STAGE_COUNTDOWN   = 3; // 五秒倒计时
  STAGE_BATTLE      = 4; // 比赛中
  STAGE_SETTLEMENT  = 5; // 比赛结算中
}

// 机器人类型（编号取自官方附录二）
enum RobotType {
  TYPE_UNKNOWN  = 0;
  TYPE_HERO     = 1;
  TYPE_ENGINEER = 2;
  TYPE_INFANTRY = 3;
  TYPE_AERIAL   = 4;
  TYPE_SENTRY   = 5;
  TYPE_DART     = 6;
  TYPE_RADAR    = 7;
}

// ===========================================================================
// 上行消息（自定义客户端 -> 服务器）
// ===========================================================================

// 2.2.1 KeyboardMouseControl 用途：键鼠输入（75Hz）
message KeyboardMouseControl {
  // keyboard_value 位掩码（实际仅需 bit0-15）：
  // 0=W 1=S 2=A 3=D 4=Shift 5=Ctrl 6=Q 7=E 8=R 9=F 10=G 11=Z 12=X 13=C 14=V 15=B
  optional int32  mouse_x           = 1; // 鼠标 x 轴速度，负值向左
  optional int32  mouse_y           = 2; // 鼠标 y 轴速度，负值向下
  optional int32  mouse_z           = 3; // 滚轮速度，负值向后
  optional bool   left_button_down  = 4; // 左键是否按下
  optional bool   right_button_down = 5; // 右键是否按下
  optional uint32 keyboard_value    = 6; // 键盘按键位掩码
  optional bool   mid_button_down   = 7; // 中键是否按下
}

// 2.2.2 CustomControl 用途：最大 30 字节自定义数据（75Hz）
message CustomControl {
  optional bytes data = 1; // 最大 30 字节
}

// 2.2.3 GameStatus 用途：比赛全局状态（5Hz）
message GameStatus {
  // current_stage: 0=未开始 1=准备 2=十五秒自检 3=五秒倒计时 4=比赛中 5=结算中
  // game_result: 0=平局 1=红胜 2=蓝胜（非结算阶段 255）
  optional uint32 current_round       = 1;
  optional uint32 total_rounds        = 2;
  optional uint32 red_score           = 3;
  optional uint32 blue_score          = 4;
  optional uint32 current_stage       = 5;
  optional int32  stage_countdown_sec = 6;
  optional int32  stage_elapsed_sec   = 7;
  optional bool   is_paused           = 8;
  optional uint32 game_result         = 9;
  optional uint32 end_reason          = 10;
}

// 2.2.4 GlobalUnitStatus 用途：基地/前哨站/机器人状态（1Hz）
message GlobalUnitStatus {
  // base_status: 0=无敌 1=解除无敌护甲未展开 2=护甲展开
  // outpost_status: 0=无敌 1=存活旋转 2=存活停转 3=击毁不可重建 4=击毁可重建 5=重建中
  optional uint32 base_health          = 1;
  optional uint32 base_status          = 2;
  optional uint32 base_shield          = 3;
  optional uint32 outpost_health       = 4;
  optional uint32 outpost_status       = 5;
  optional uint32 enemy_base_health    = 6;
  optional uint32 enemy_base_status    = 7;
  optional uint32 enemy_base_shield    = 8;
  optional uint32 enemy_outpost_health = 9;
  optional uint32 enemy_outpost_status = 10;
  // robot_health 顺序：己方 1,2,3,4,7 号，对方 1,2,3,4,7 号
  repeated uint32 robot_health         = 11;
  repeated int32  robot_bullets        = 12;
  optional uint32 total_damage_ally    = 13;
  optional uint32 total_damage_enemy   = 14;
}

// 2.2.5 GlobalLogisticsStatus 用途：全局后勤（1Hz）
message GlobalLogisticsStatus {
  optional uint32 remaining_economy      = 1;
  optional uint64 total_economy_obtained = 2;
  optional uint32 tech_level             = 3;
  optional uint32 encryption_level       = 4;
}

// 2.2.6 GlobalSpecialMechanism 用途：全局特殊机制（1Hz）
message GlobalSpecialMechanism {
  // mechanism_id: 1=己方堡垒被占计时 2=对方堡垒被占计时
  repeated uint32 mechanism_id       = 1;
  repeated int32  mechanism_time_sec = 2;
}

// 2.2.7 Event 用途：全局事件（触发式）
message Event {
  // event_id: 1=击杀 2=前哨站被摧毁 3=大符激活(臂数,平均环数) 4=能量机关激活(1小2大)
  // 5=己方英雄狙击伤害 6=对方英雄狙击伤害 7=对方呼叫空中支援 8=对方空中支援被反制
  // 9=飞镖命中(1红2蓝,目标) 10=对方飞镖闸门开启 11=基地遭攻击 12=对方前哨站停转
  // 13=对方基地护甲展开 14=装配中对方请求四级 15=装配结果
  optional int32  event_id = 1;
  optional string param    = 2;
}

// 2.2.8 RobotInjuryStat 用途：一次存活期累计受伤（1Hz）
message RobotInjuryStat {
  optional uint32 total_damage            = 1;
  optional uint32 collision_damage        = 2;
  optional uint32 small_projectile_damage = 3; // 17mm
  optional uint32 large_projectile_damage = 4; // 42mm
  optional uint32 dart_splash_damage      = 5;
  optional uint32 module_offline_damage   = 6;
  optional uint32 offline_damage          = 7;
  optional uint32 penalty_damage          = 8;
  optional uint32 server_kill_damage      = 9;
  optional uint32 killer_id               = 10;
}

// 2.2.9 RobotRespawnStatus 用途：复活状态（1Hz）
message RobotRespawnStatus {
  optional bool   is_pending_respawn       = 1;
  optional uint32 total_respawn_progress   = 2;
  optional uint32 current_respawn_progress = 3;
  optional bool   can_free_respawn         = 4;
  optional uint32 gold_cost_for_respawn    = 5;
  optional bool   can_pay_for_respawn      = 6;
}

// 2.2.10 RobotStaticStatus 用途：机器人固定属性（1Hz）
message RobotStaticStatus {
  // performance_system_shooter: 1=冷却优先 2=爆发优先 3=英雄近战 4=英雄远程
  // performance_system_chassis: 1=血量优先 2=功率优先 3=英雄近战 4=英雄远程
  optional uint32 connection_state           = 1; // 0=未连接 1=已连接
  optional uint32 field_state                = 2; // 0=已上场 1=未上场
  optional uint32 alive_state                = 3; // 0=未知 1=存活 2=战亡
  optional uint32 robot_id                   = 4;
  optional uint32 robot_type                 = 5;
  optional uint32 performance_system_shooter = 6;
  optional uint32 performance_system_chassis = 7;
  optional uint32 level                      = 8;
  optional uint32 max_health                 = 9;
  optional uint32 max_heat                   = 10;
  optional float  heat_cooldown_rate         = 11;
  optional uint32 max_power                  = 12;
  optional uint32 max_buffer_energy          = 13;
  optional uint32 max_chassis_energy         = 14;
}

// 2.2.11 RobotDynamicStatus 用途：机器人实时数据（10Hz，clientID 绑定车的）
message RobotDynamicStatus {
  optional uint32 current_health            = 1;
  optional float  current_heat              = 2;
  optional float  last_projectile_fire_rate = 3;
  optional uint32 current_chassis_energy    = 4;
  optional uint32 current_buffer_energy     = 5;
  optional uint32 current_experience        = 6;
  optional uint32 experience_for_upgrade    = 7;
  optional uint32 total_projectiles_fired   = 8;
  optional uint32 remaining_ammo            = 9;
  optional bool   is_out_of_combat          = 10;
  optional uint32 out_of_combat_countdown   = 11;
  optional bool   can_remote_heal           = 12;
  optional bool   can_remote_ammo           = 13;
}

// 2.2.12 RobotModuleStatus 用途：模块在线状态（1Hz）
message RobotModuleStatus {
  // 各字段：0=离线 1=在线 2=因安装不规范被视为离线
  optional uint32 power_manager           = 1;
  optional uint32 rfid                    = 2;
  optional uint32 light_strip             = 3;
  optional uint32 small_shooter           = 4;
  optional uint32 big_shooter             = 5;
  optional uint32 uwb                     = 6;
  optional uint32 armor                   = 7;
  optional uint32 video_transmission      = 8;
  optional uint32 capacitor               = 9;
  optional uint32 main_controller         = 10;
  optional uint32 laser_detection_module  = 11;
}

// 2.2.13 RobotPosition 用途：坐标与朝向（1Hz）
message RobotPosition {
  optional float  x        = 1;
  optional float  y        = 2;
  optional float  z        = 3;
  optional float  yaw      = 4; // 正北为 0 度
  optional uint32 robot_id = 5; // 6/106 空中，7/107 哨兵（仅云台手客户端生效）
}

// 2.2.14 Buff 用途：增益（获得时触发，之后 1Hz 定频至失去）
message Buff {
  // buff_type: 1=攻击 2=防御/易伤 3=热冷却 4=底盘功率 5=回血 6=可兑换发弹量 7=地形跨越
  optional uint32 robot_id       = 1;
  optional uint32 buff_type      = 2;
  optional int32  buff_level     = 3;
  optional uint32 buff_max_time  = 4;
  optional uint32 buff_left_time = 5;
}

// 2.2.15 PenaltyInfo 用途：判罚（触发式）
message PenaltyInfo {
  // penalty_type: 1=黄牌 2=双方黄牌 3=红牌 4=超功率 5=超热量 6=超射速
  optional uint32 penalty_type       = 1;
  optional uint32 penalty_effect_sec = 2;
  optional uint32 total_penalty_num  = 3;
}

// 2.2.16 RobotPathPlanInfo 用途：哨兵轨迹规划（触发式）
message RobotPathPlanInfo {
  optional uint32 intention   = 1; // 1=攻击 2=防守 3=移动
  optional uint32 start_pos_x = 2; // 分米
  optional uint32 start_pos_y = 3; // 分米
  repeated int32  offset_x    = 4 [packed = true]; // 长度 49
  repeated int32  offset_y    = 5 [packed = true]; // 长度 49
  optional uint32 sender_id   = 6;
}

// 2.2.17 MapClickInfo 用途：地图点击标记信息同步（下行，触发式）
message MapClickInfo {
  // mode: 标记类型（1=攻击 2=防御 3=警戒 4=自定义）
  // type: 标记模式（1=地图 2=对方机器人）
  optional uint32 is_send_all = 1; // 0=指定客户端 1=除哨兵 2=包含哨兵
  optional bytes  robot_id    = 2; // 固定 7 字节（红 1,2…；蓝 101,102…；余填 0）
  optional uint32 mode        = 3;
  optional uint32 enemy_id    = 4;
  optional uint32 ascii       = 5; // C-L,N,O,Q-Z
  optional uint32 type        = 6;
  optional float  map_x       = 7;
  optional float  map_y       = 8;
}

// 2.2.18 MapClickCmd 用途：地图点击标记指令（上行，触发式）
message MapClickCmd {
  // mode: 标记类型（1=攻击 2=防御 3=警戒 4=自定义）
  // type: 标记模式（1=地图 2=对方机器人）
  optional uint32 is_send_all = 1;
  optional bytes  robot_id    = 2;
  optional uint32 mode        = 3;
  optional uint32 enemy_id    = 4;
  optional uint32 ascii       = 5;
  optional uint32 type        = 6;
  optional float  map_x       = 7;
  optional float  map_y       = 8;
}

// 2.2.19 RadarInfoToClient 用途：雷达机器人位置（触发式）
// 顺序：对方 1,2,3,4,6,7 号，己方 1,2,3,4,6,7 号。
message RadarInfoToClient {
  repeated RadarSingleRobotInfo robot_info = 1;
}

message RadarSingleRobotInfo {
  optional uint32 target_pos_x  = 1; // cm
  optional uint32 target_pos_y  = 2; // cm
  optional uint32 is_high_light = 3; // 0=否 1=是 2=是但定位模块离线
}

// 2.2.20 CustomByteBlock 用途：机器人自定义数据流（50Hz，≤2.4kbit）
message CustomByteBlock {
  optional bytes data = 1;
}

// 2.2.21 AssemblyCommand 用途：工程装配（上行，≤10Hz）
message AssemblyCommand {
  optional uint32 operation  = 1; // 0=开始兑换 1=确认装配 2=取消装配
  optional uint32 difficulty = 2;
}

// 2.2.22 TechCoreMotionStateSync 用途：科技核心运动状态（1Hz）
message TechCoreMotionStateSync {
  optional uint32 maximum_difficulty_level = 1;
  optional uint32 basic_state              = 2; // 1=初始 2=运动中 3=已到达
  optional uint32 putin_state              = 3;
  optional uint32 move_state               = 4;
  optional uint32 rotate_state             = 5;
  optional uint32 enemy_core_status        = 6; // 0=无 1=非四级 2=四级
  optional uint32 remain_time_all          = 7;
  optional uint32 remain_time_step         = 8;
}

// 2.2.23 RobotPerformanceSelectionCommand 用途：性能体系/控制方式选择（上行，≤10Hz）
message RobotPerformanceSelectionCommand {
  optional uint32 shooter        = 1; // 1=冷却 2=爆发 3=英雄近战 4=英雄远程
  optional uint32 chassis        = 2; // 1=血量 2=功率 3=英雄近战 4=英雄远程
  optional uint32 sentry_control = 3; // 0=自动 1=半自动
}

// 2.2.24 RobotPerformanceSelectionSync 用途：性能体系状态同步（1Hz）
message RobotPerformanceSelectionSync {
  optional uint32 shooter        = 1;
  optional uint32 chassis        = 2;
  optional uint32 sentry_control = 3;
}

// 2.2.25 CommonCommand 用途：常用指令（上行，≤10Hz）
message CommonCommand {
  // cmd_type: 1=兑换17mm(参数须为10倍数) 2=兑换42mm 3=确认复活
  //           4=兑换立即复活 5=远程兑换允许发弹量 6=远程兑换血量
  optional uint32 cmd_type = 1;
  optional uint32 param    = 2;
}

// 2.2.26 HeroDeployModeEventCommand 用途：英雄部署模式（上行，≤10Hz）
message HeroDeployModeEventCommand {
  optional uint32 mode = 1; // 0=退出 1=进入
}

// 2.2.27 DeployModeStatusSync 用途：英雄部署模式状态同步（1Hz）
message DeployModeStatusSync {
  optional uint32 status = 1; // 0=未部署 1=已部署
}

// 2.2.28 RuneActivateCommand 用途：能量机关激活（上行，≤10Hz）
message RuneActivateCommand {
  optional uint32 activate = 1; // 1=开启
}

// 2.2.29 RuneStatusSync 用途：能量机关状态同步（1Hz）
message RuneStatusSync {
  // rune_status: 1=未激活 2=正在激活 3=已激活
  optional uint32 rune_status    = 1;
  optional uint32 activated_arms = 2;
  optional float  average_rings  = 3;
}

// 2.2.30 SentryStatusSync 用途：哨兵姿态（1Hz）
message SentryStatusSync {
  optional uint32 posture_id  = 1; // 1=进攻 2=防御 3=移动
  optional bool   is_weakened = 2;
  optional bool   is_powered  = 3;
}

// 2.2.31 DartCommand 用途：飞镖控制（上行，≤10Hz）
message DartCommand {
  // target_id: 1=前哨站 2=基地固定 3=基地随机固定 4=基地随机移动 5=基地末端移动
  optional uint32 target_id      = 1;
  optional bool   open           = 2;
  optional bool   launch_confirm = 3;
}

// 2.2.32 DartSelectTargetStatusSync 用途：飞镖目标选择状态（1Hz）
message DartSelectTargetStatusSync {
  optional uint32 target_id = 1;
  optional uint32 open      = 2; // 0=关闭 1=开启中 2=已开启
}

// 2.2.33 SentryCtrlCommand 用途：哨兵控制请求（上行，≤10Hz）
message SentryCtrlCommand {
  // command_id: 1=补血点补弹 3=远程补弹 4=远程回血 5=确认复活 6=花费金币复活
  //             7=进攻 8=防御 9=移动 10=强化进攻 11=强化防御 12=强化移动
  optional uint32 command_id = 1;
}

// 2.2.34 SentryCtrlResult 用途：哨兵控制结果（触发式）
message SentryCtrlResult {
  optional uint32 command_id  = 1;
  optional uint32 result_code = 2; // 0=成功
}

// 2.2.35 AirSupportCommand 用途：空中支援指令（上行，触发式）
message AirSupportCommand {
  // command_id: 0=取消 1=免费 2=花金币 3=花金币解除反制
  optional uint32 command_id = 1;
}

// 2.2.36 AirSupportStatusSync 用途：空中支援状态反馈（1Hz）
message AirSupportStatusSync {
  // airsupport_status: 0=未进行 1=正在
  // shooter_status: 0=锁定不可解 1=正常 2=锁定可花金币解
  optional uint32 airsupport_status = 1;
  optional uint32 left_time         = 2;
  optional uint32 cost_coins        = 3;
  optional uint32 is_being_targeted = 4;
  optional uint32 shooter_status    = 5;
}
