name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.11.2'
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf

      - name: Cache vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/protobuf3196
            third_party/paho
            third_party/ffmpeg
            third_party/ffmpeg-cli
          key: deps-linux-${{ hashFiles('third_party/setup-deps.sh', 'third_party/build-ffmpeg.sh') }}

      - name: Build dependencies
        run: ./third_party/setup-deps.sh

      - name: Build client + tests
        run: |
          cmake -S client -B client/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build client/build

      - name: Run unit tests
        run: ctest --test-dir client/build --output-on-failure

      - name: Build simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build simulator/build

      - name: Package AppImages
        run: |
          ./packaging/linux-appimage.sh client/build/rm_client packaging/rm_client.desktop rm_client
          ./packaging/linux-appimage.sh simulator/build/rm_simulator packaging/rm_simulator.desktop rm_simulator --with-ffmpeg --with-broker

      - uses: actions/upload-artifact@v4
        with:
          name: rm-linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows x86_64 (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git curl tar zip unzip make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools

      - name: Cache vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/protobuf3196
            third_party/paho
            third_party/ffmpeg
            third_party/ffmpeg-cli
          key: deps-windows-${{ hashFiles('third_party/setup-deps.sh', 'third_party/build-ffmpeg.sh') }}

      - name: Build dependencies
        run: ./third_party/setup-deps.sh

      - name: Build client
        run: |
          cmake -S client -B client/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build client/build

      - name: Build simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build simulator/build

      - name: Package zips
        run: |
          ./packaging/bundle-windows.sh client/build/rm_client rm_client
          ./packaging/bundle-windows.sh simulator/build/rm_simulator rm_simulator --with-ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: rm-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "target=--target $GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then ref="tags/$GITHUB_REF_NAME"; else ref="heads/$GITHUB_REF_NAME"; fi
          msg=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq '.commit.message')
          mv dist/rm_client.AppImage      "dist/rm_client-$V-linux-x86_64.AppImage"
          mv dist/rm_simulator.AppImage   "dist/rm_simulator-$V-linux-x86_64.AppImage"
          mv dist/rm_client.zip           "dist/rm_client-$V-windows-x86_64.zip"
          mv dist/rm_simulator.zip        "dist/rm_simulator-$V-windows-x86_64.zip"
          gh release create "$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            ${{ steps.ver.outputs.target }} \
            --title "$V" \
            --notes "$msg"

